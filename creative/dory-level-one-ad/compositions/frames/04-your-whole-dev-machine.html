  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const frameId = "04-your-whole-dev-machine";
      const frameRoot = document.querySelector('[data-composition-id="04-your-whole-dev-machine"]');
      const byId = (suffix) => document.getElementById(`${frameId}-${suffix}`);
      const timeline = gsap.timeline({ paused: true });

      window.__timelines = window.__timelines || {};
      window.__timelines[frameId] = timeline;

      const iconTile = byId("icon-tile");
      const fishTile = byId("fish-tile");
      const letters = ["letter-d", "letter-o", "letter-r", "letter-y"].map(byId);
      const wallpaper = ["wallpaper-a", "wallpaper-b", "wallpaper-c"].map(byId);
      const underline = byId("underline");
      const proof = byId("proof");
      const metaRow = byId("meta-row");

      timeline.fromTo(
        iconTile,
        { scale: 0, y: -92, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.58, ease: "power3.out" },
        0.02,
      );

      timeline.fromTo(
        fishTile,
        { x: -72, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.52, ease: "power3.out" },
        0.12,
      );

      const wallpaperFrom = [
        { x: -86, opacity: 0 },
        { x: 88, opacity: 0 },
        { x: -74, opacity: 0 },
      ];

      wallpaper.forEach((pill, index) => {
        timeline.fromTo(
          pill,
          wallpaperFrom[index],
          { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
          0.05 + index * 0.05,
        );
      });

      timeline.set(letters, { opacity: 0 }, 0);
      const waterfall = [
        { start: 0.16, y: 78, duration: 0.18 },
        { start: 0.31, y: 50, duration: 0.16 },
        { start: 0.44, y: 44, duration: 0.14 },
        { start: 0.55, y: 38, duration: 0.13 },
      ];

      letters.forEach((letter, index) => {
        const beat = waterfall[index];
        timeline.set(letter, { opacity: 1, y: beat.y }, beat.start);
        timeline.to(letter, { y: 0, duration: beat.duration, ease: "power4.out" }, beat.start);
      });

      const COPY = [
        {
          nodes: Array.from(frameRoot.querySelectorAll('[data-04-your-whole-dev-machine-copy="one"]')),
          baseDuration: 0.055,
          secondsPerCharacter: 0.006,
          hold: 0.055,
        },
        {
          nodes: Array.from(frameRoot.querySelectorAll('[data-04-your-whole-dev-machine-copy="two"]')),
          baseDuration: 0.06,
          secondsPerCharacter: 0.006,
          hold: 0,
        },
      ];

      let copyCursor = 0.72;
      const COPY_TIMELINE = COPY.map((entry) => {
        const wordDurations = entry.nodes.map(
          (node) => entry.baseDuration + node.textContent.length * entry.secondsPerCharacter,
        );
        const start = copyCursor;
        const duration = wordDurations.reduce((sum, value) => sum + value, 0) + entry.hold;
        copyCursor += duration;
        return { ...entry, wordDurations, start, end: copyCursor };
      });

      COPY_TIMELINE.forEach((entry) => {
        let wordCursor = entry.start;
        entry.nodes.forEach((word, index) => {
          timeline.fromTo(
            word,
            { yPercent: 112, opacity: 0 },
            { yPercent: 0, opacity: 1, duration: 0.3, ease: "power4.out" },
            wordCursor,
          );
          wordCursor += entry.wordDurations[index];
        });
      });

      timeline.fromTo(
        underline,
        { scaleX: 0 },
        { scaleX: 0.96, duration: 1.16, ease: "power2.out" },
        1.49,
      );
      timeline.to(underline, { scaleX: 1, duration: 0.15, ease: "power2.out" }, 2.65);

      timeline.fromTo(
        proof,
        { scale: 0, y: 12, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.88,
      );

      timeline.fromTo(
        metaRow,
        { scale: 0, y: 24, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.62, ease: "power3.out" },
        2.03,
      );
    })();
