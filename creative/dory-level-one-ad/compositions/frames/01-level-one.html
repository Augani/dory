  <script>
    (() => {
      const byId = (id) => document.getElementById(id);
      const routeBase = byId("01-level-one-route-base");
      const routeOpen = byId("01-level-one-route-open");
      const routeHighlight = byId("01-level-one-route-highlight");
      const stopCap = byId("01-level-one-stop-cap");
      const capBurst = byId("01-level-one-cap-burst");
      const portalRing = byId("01-level-one-portal-ring");
      const sceneA = byId("01-level-one-scene-a");
      const titlePill = byId("01-level-one-title-pill");
      const cube = byId("01-level-one-cube");
      const containersPill = byId("01-level-one-containers-pill");
      const levelStage = byId("01-level-one-level-stage");
      const pressStage = byId("01-level-one-press-stage");
      const keepGoing = byId("01-level-one-keep-going");
      const clickRipple = byId("01-level-one-click-ripple");
      const dory = byId("01-level-one-dory");

      [routeBase, routeOpen, routeHighlight].forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = String(length);
        path.style.strokeDashoffset = String(length);
      });

      const copyPieces = Array.from(document.querySelectorAll('[id="01-level-one-stops-row"] span'));
      let copyCursor = 0.34;
      const copyTimeline = copyPieces.map((element) => {
        const contentLength = element.textContent.trim().length;
        const revealDuration = Math.min(0.28, 0.16 + contentLength * 0.014);
        const start = copyCursor;
        copyCursor += revealDuration * 0.58;
        return { element, start, revealDuration };
      });

      const tl = gsap.timeline({ paused: true });

      tl.set([levelStage, pressStage, routeOpen, portalRing], { opacity: 0 }, 0);
      tl.set(capBurst, { opacity: 0, scale: 1 }, 0);

      tl.to(routeBase, { strokeDashoffset: 0, duration: 0.52, ease: "power2.out" }, 0.02);
      tl.to(routeHighlight, { strokeDashoffset: 0, duration: 0.46, ease: "power2.out" }, 0.08);

      tl.fromTo(
        cube,
        { scale: 0, opacity: 0, y: 18 },
        { scale: 1, opacity: 1, y: 0, duration: 0.46, ease: "power3.out" },
        0,
      );
      tl.fromTo(
        titlePill,
        { scale: 0, opacity: 0, y: 10 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        0.04,
      );
      tl.fromTo(
        stopCap,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.34, ease: "power3.out" },
        0.1,
      );

      copyTimeline.forEach(({ element, start, revealDuration }) => {
        tl.fromTo(
          element,
          { scale: 0.82, opacity: 0, y: 18 },
          { scale: 1, opacity: 1, y: 0, duration: revealDuration, ease: "power3.out" },
          start,
        );
      });

      tl.fromTo(
        containersPill,
        { scale: 0.86, opacity: 0, y: 24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.46, ease: "power3.out" },
        copyCursor + 0.08,
      );

      tl.to(cube, { x: 50, duration: 0.16, ease: "power1.in" }, 1.16);
      tl.to(stopCap, { scale: 0.9, duration: 0.16, ease: "power1.in" }, 1.16);
      tl.to(cube, { x: 0, duration: 0.34, ease: "power2.out" }, 1.32);
      tl.to(stopCap, { scale: 1, duration: 0.38, ease: "back.out(1.6)" }, 1.32);
      tl.fromTo(
        capBurst,
        { scale: 1, opacity: 0 },
        { scale: 3.4, opacity: 0.56, duration: 0.34, ease: "power2.out" },
        1.32,
      );
      tl.to(capBurst, { opacity: 0, duration: 0.26, ease: "power2.in" }, 1.55);

      tl.fromTo(
        dory,
        { x: 880, opacity: 0 },
        { x: 690, opacity: 1, duration: 0.6, ease: "power3.out" },
        1.68,
      );

      tl.to(sceneA, { scale: 0.8, filter: "blur(10px)", duration: 0.2, ease: "power3.in" }, 2.6);
      tl.to(sceneA, { opacity: 0.15, duration: 0.2, ease: "none" }, 2.6);
      tl.set(sceneA, { opacity: 0 }, 2.8);
      tl.set(levelStage, { opacity: 0.15, scale: 1.25, filter: "blur(10px)" }, 2.8);
