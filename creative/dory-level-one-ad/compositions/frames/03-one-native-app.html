    (() => {
      const frameId = "03-one-native-app";
      const world = document.getElementById(`${frameId}-world`);
      const outgoing = document.getElementById(`${frameId}-outgoing`);
      const incoming = document.getElementById(`${frameId}-incoming`);
      const unified = document.getElementById(`${frameId}-unified`);
      const proof = document.getElementById(`${frameId}-proof`);
      const accentLine = document.getElementById(`${frameId}-accent-line`);
      const columns = Array.from(document.querySelectorAll('[class~="03-one-native-app-capability-column"]'));
      const wordElements = Array.from(document.querySelectorAll('[class~="03-one-native-app-headline-word"]'));

      const cam = { scale: 2.45, x: 276, y: 204 };
      const applyCamera = () => {
        world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`;
      };
      applyCamera();

      const tl = gsap.timeline({ paused: true });

      tl.to(
        cam,
        {
          scale: 1,
          x: 0,
          y: 0,
          duration: 0.82,
          ease: "power4.out",
          onUpdate: applyCamera,
        },
        0,
      );

      columns.forEach((column, index) => {
        const targetX = Number(column.dataset.targetX);
        const targetY = Number(column.dataset.targetY);
        tl.fromTo(
          column,
          {
            xPercent: -50,
            yPercent: -50,
            x: targetX,
            y: targetY,
            scale: 1,
            opacity: 1,
          },
          {
            xPercent: -50,
            yPercent: -50,
            x: 0,
            y: 0,
            scale: 0.7,
            opacity: 0,
            duration: 0.58,
            ease: "power3.out",
          },
          0.82 + index * 0.045,
        );
      });

      tl.fromTo(
        unified,
        { scale: 0.76, opacity: 0, y: 18 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.4)" },
        1.04,
      );

      const baseWordDuration = 0.105;
      const secondsPerCharacter = 0.009;
      let wordCursor = 0.88;
      const wordTimeline = wordElements.map((element) => {
        const duration = baseWordDuration + element.dataset.word.length * secondsPerCharacter;
        const entry = { element, start: wordCursor, duration };
        wordCursor += duration;
        return entry;
      });

      wordTimeline.forEach(({ element, start }) => {
        tl.fromTo(
          element,
          { opacity: 0, y: 42, scale: 0.94 },
          { opacity: 1, y: 0, scale: 1, duration: 0.32, ease: "power3.out" },

      tl.fromTo(

        { scaleX: 1, opacity: 1, duration: 0.38, ease: "power3.out" },

      tl.to(
        outgoing,
        { scale: 0.7, opacity: 0, duration: 0.34, ease: "power2.in" },
        1.72,
      );

      tl.fromTo(
        incoming,
        { scale: 0.7, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.52, ease: "back.out(1.4)" },
        1.91,
      );

      tl.fromTo(
        proof,
        { clipPath: "inset(0 100% 0 0 round 9999px)", opacity: 1 },
        { clipPath: "inset(0 0% 0 0 round 9999px)", opacity: 1, duration: 0.52, ease: "power3.out" },
        1.98,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["03-one-native-app"] = tl;
    })();
