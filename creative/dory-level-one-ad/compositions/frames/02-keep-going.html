                  <rect data-volume="left" x="8" y="20" width="46" height="36" rx="10"></rect>
                  <rect data-volume="right" x="144" y="20" width="46" height="36" rx="10"></rect>
                  <path data-draw="bridge" d="M 58 38 C 83 7 116 7 140 38"></path>
                  <path data-draw="bridge-arrow" d="M 125 30 L 140 38 L 130 52"></path>
                  <path data-draw="bridge-check" d="M 157 38 L 165 47 L 181 29"></path>

        <div data-world="6" data-target-x="240" data-target-y="205">

              <div data-kicker>SAFELY SEPARATED</div>
              <div data-title>ISOLATED AGENT<br />SANDBOXES</div>
            </div>

              <div data-sandbox-proof="02-keep-going">

              <svg data-shield-svg viewBox="0 0 50 50" aria-hidden="true">
                <path data-draw="shield" d="M 25 5 L 40 11 V 24 C 40 34 34 41 25 45 C 16 41 10 34 10 24 V 11 Z"></path>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const frameRoot = document.querySelector('[data-composition-id="02-keep-going"]');
      const one = (selector) => frameRoot.querySelector(selector);
      const all = (selector) => Array.from(frameRoot.querySelectorAll(selector));
      const tl = gsap.timeline({ paused: true });

      window.__timelines = window.__timelines || {};
      window.__timelines["02-keep-going"] = tl;

      all("[data-draw]").forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = String(length);
        path.style.strokeDashoffset = String(length);
      });

      const stateAt = (sequence, time) => {
        for (let index = sequence.length - 1; index >= 0; index -= 1) {
          if (time >= sequence[index].t) return sequence[index].text;
        }
        return "";
      };

      const headlineSequence = [
        { t: 0, text: "DORY STARTS WITH" },
        { t: 2.35, text: "KEEP GOING" },
      ];
      const migrationSequence = [
        { t: 0, text: "" },
        { t: 7.06, text: "MIGRATE" },
        { t: 7.58, text: "RECOVER" },
      ];
      const stateDriver = { t: 0 };

      tl.to(
        stateDriver,
        {
          t: 9.73,
          duration: 9.73,
          ease: "none",
          onUpdate: () => {
            one('[data-header-text="02-keep-going"]').textContent = stateAt(headlineSequence, stateDriver.t);
            one('[data-state-pill="02-keep-going"]').textContent = stateAt(migrationSequence, stateDriver.t);
          },
        },
        0,
      );

      const assembleWorld = (number, at, duration, startProgress) => {
        const world = one('[data-world="' + number + '"]');
        const targetX = Number(world.dataset.targetX);
        const targetY = Number(world.dataset.targetY);
        tl.fromTo(
          world,
          {
            xPercent: -50,
            yPercent: -50,
            x: targetX * startProgress,
            y: targetY * startProgress,
            scale: 0.88,
            opacity: 0,
          },
          {
            x: targetX,
            y: targetY,
            scale: 1,
            opacity: 1,
            duration,
            ease: "power3.out",
          },
          at,
        );
      };

      const drawPath = (name, at, duration, ease) => {
        tl.to(
          one('[data-draw="' + name + '"]'),
          {
            strokeDashoffset: 0,
            duration,
            ease: ease || "power2.out",
          },
          at,
        );
      };

      const verifyNode = (number, at, color) => {
        const node = one('[data-node="' + number + '"]');
        const meter = one('[data-meter-dot="' + number + '"]');
        tl.fromTo(
          node,
          { scale: 0.78, backgroundColor: "#ffffff" },
          {
            scale: 1,
            backgroundColor: color,
            duration: 0.32,
            ease: "power3.out",
          },
          at,
        );
        tl.fromTo(
          meter,
          { scale: 0.45, backgroundColor: "#ffffff" },
          {
            scale: 1,
            backgroundColor: color,
            duration: 0.26,
            ease: "power3.out",
          },
          at + 0.04,
        );
      };

      tl.fromTo(
        one('[data-scene-layer="02-keep-going-scene"]'),
        { opacity: 0 },
        { opacity: 1, duration: 0.36, ease: "power1.out" },
        0,
      );
      tl.fromTo(
        one('[data-header-strip="02-keep-going"]'),
        { y: -18, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
        0.05,
      );
      tl.fromTo(
        one('[data-header-accent="02-keep-going"]'),
        { scaleX: 0 },
        { scaleX: 0.32, duration: 0.72, ease: "power3.out" },
        0.18,
      );

      assembleWorld(1, 0.1, 0.74, 0.5);
      drawPath("route-0", 0.12, 0.74, "none");
      drawPath("docker-a", 0.42, 0.44);
      drawPath("docker-b", 0.74, 0.44);
      drawPath("docker-c", 1.06, 0.44);
      drawPath("docker-base", 1.39, 0.34);
      verifyNode(1, 1.48, "#98c7f6");

      all("[data-socket]").forEach((socket, index) => {
        if (index === 0) return;
        tl.to(
          socket,
          {
            opacity: 0.74,
            borderColor: "#07111f",
            backgroundColor: "rgba(220, 235, 250, 0.58)",
            duration: 0.22,
            ease: "power2.out",
          },
          2.35 + (index - 1) * 0.12,
        );
      });
      tl.fromTo(
        one('[data-sweep="02-keep-going"]'),
        { x: -420, opacity: 0 },
        {
          x: 1320,
          opacity: 0.23,
          duration: 0.66,
          ease: "none",
        },
        2.35,
      );
      tl.to(
        one('[data-sweep="02-keep-going"]'),
        { opacity: 0, duration: 0.18, ease: "power1.in" },
        3.01,
      );
      tl.to(
        one('[data-header-strip="02-keep-going"]'),
        { backgroundColor: "#ffd68b", duration: 0.24, ease: "power1.out" },
        2.35,
      );
      tl.fromTo(
        one('[data-header-accent="02-keep-going"]'),
        { scaleX: 0.32 },
        { scaleX: 1, duration: 0.76, ease: "power3.out" },
        2.36,
      );

      assembleWorld(2, 3.2, 0.62, 0.5);
      drawPath("route-1", 2.45, 0.9, "none");
      drawPath("kube-crown-a", 3.43, 0.54);
      drawPath("kube-crown-b", 3.84, 0.34);
      all("[data-kube-dot]").forEach((dot, index) => {
        tl.fromTo(
          dot,
          { scale: 0.3, opacity: 0, transformOrigin: "center center" },
          { scale: 1, opacity: 1, transformOrigin: "center center", duration: 0.25, ease: "power3.out" },
          3.72 + index * 0.09,
        );
      });
      verifyNode(2, 4.02, "#3d7bf4");

      assembleWorld(3, 4.45, 0.6, 0.5);
      drawPath("route-2", 4.48, 0.78, "none");
      all("[data-desktop-tab]").forEach((tab, index) => {
        tl.fromTo(
          tab,
          { y: 13, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.28, ease: "power3.out" },
          4.74 + index * 0.2,
        );
      });
      verifyNode(3, 5.26, "#dcebfa");

      assembleWorld(4, 5.7, 0.58, 0.5);
      drawPath("route-3", 5.73, 0.68, "none");
      all("[data-server-row]").forEach((row, index) => {
        tl.fromTo(
          row,
          { x: -24, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.28, ease: "power3.out" },
          5.91 + index * 0.1,
        );
      });
      tl.fromTo(
        one("[data-persistent-fill]"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.82, ease: "power2.out" },
        5.95,
      );
      tl.fromTo(
        one("[data-persistent-label]"),
        { opacity: 0 },
        { opacity: 1, duration: 0.28, ease: "power1.out" },
        6.28,
      );
      verifyNode(4, 6.38, "#ffd68b");

      assembleWorld(5, 6.82, 0.6, 0.5);
      drawPath("route-4", 6.86, 0.82, "none");
      all("[data-volume]").forEach((volume, index) => {
        tl.fromTo(
          volume,
          { scale: 0.65, opacity: 0, transformOrigin: "center center" },
          { scale: 1, opacity: 1, transformOrigin: "center center", duration: 0.3, ease: "power3.out" },
          7.0 + index * 0.18,
        );
      });
      drawPath("bridge", 7.08, 0.56);
      drawPath("bridge-arrow", 7.5, 0.3);
      drawPath("bridge-check", 7.72, 0.3);
      verifyNode(5, 7.72, "#cde5fa");

      tl.fromTo(
        one('[data-bloom="02-keep-going"]'),
        { opacity: 0, scale: 0.88 },
        { opacity: 0.28, scale: 1, duration: 0.68, ease: "power2.out" },
        8.18,
      );
      assembleWorld(6, 8.18, 0.72, 0.45);
      drawPath("route-5", 8.23, 0.86, "none");
      all("[data-cell]").forEach((cell, index) => {
        tl.fromTo(
          cell,
          { y: 18, scale: 0.76, opacity: 0 },
          { y: 0, scale: 1, opacity: 1, duration: 0.32, ease: "power3.out" },
          8.46 + index * 0.13,
        );
      });
      drawPath("shield", 8.52, 0.52);
      drawPath("shield-check", 8.91, 0.3);
      verifyNode(6, 8.86, "#147fe8");
      tl.to(
        one('[data-bloom="02-keep-going"]'),
        { opacity: 0.2, scale: 1.04, duration: 0.32, ease: "power1.out" },
        8.86,
      );
      tl.fromTo(
        one('[data-payoff="02-keep-going"]'),
        { y: 18, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.44, ease: "power3.out" },
        8.88,
      );
      tl.to(
        all("[data-node]"),
        { scale: 1.06, duration: 0.16, ease: "power2.out", stagger: 0.035 },
        9.04,
      );
      tl.to(
        all("[data-node]"),
        { scale: 1, duration: 0.18, ease: "power2.out", stagger: 0.025 },
        9.25,
      );
    })();
  </script>
</template>
