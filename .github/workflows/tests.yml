name: Tests

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  p02-userspace-boot:
    name: P02 userspace boot (${{ matrix.tier }})
    # ARM64 hosted image; this is CPU/PC engineering acceptance, not physical release qualification.
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tier: [interpreter, baseline-jit]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      DORY_P02_TIER: ${{ matrix.tier }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Record source and require the ARM64 build tuple
        timeout-minutes: 5
        run: |
          set -euo pipefail
          p02_directory="$RUNNER_TEMP/dory-p02-userspace"
          mkdir -p "$p02_directory/evidence" "$p02_directory/fixtures"
          echo "DORY_P02_DIRECTORY=$p02_directory" >> "$GITHUB_ENV"
          cp Config/DoryVirtualizationGuestCandidates.json "$p02_directory/evidence/candidate-catalog.json"
          cp guest/diagnostics/p02-minimal-userspace/fixture.json "$p02_directory/evidence/fixture-recipe.json"
          {
            git rev-parse HEAD
            git status --porcelain
            sw_vers
            uname -a
            printf 'ImageOS=%s\nImageVersion=%s\n' "${ImageOS:-unavailable}" "${ImageVersion:-unavailable}"
            test "$(uname -m)" = arm64
            test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
            xcodebuild -version
            test "$(xcodebuild -version)" = $'Xcode 26.6\nBuild version 17F113'
            test "$(xcrun --sdk macosx --show-sdk-version)" = 26.5
            swift --version
            python3 --version
            tar --version
            shasum -a 256 Config/DoryVirtualizationGuestCandidates.json \
              guest/diagnostics/p02-minimal-userspace/fixture.json \
              guest/diagnostics/p02-minimal-userspace/init scripts/prepare-virtualization-fixtures.py
          } 2>&1 | tee "$p02_directory/evidence/source-host.log"
      - name: Install the repository Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.95.0' # rust-toolchain.toml
      - name: Install Protocol Buffers compiler
        timeout-minutes: 10
        run: |
          set -euo pipefail
          brew install protobuf 2>&1 | tee "$DORY_P02_DIRECTORY/evidence/protobuf-install.log"
          protoc --version | tee "$DORY_P02_DIRECTORY/evidence/protobuf-version.log"
      - name: Prepare the clean-checkout Swift package dependency
        timeout-minutes: 35
        run: |
          set -euo pipefail
          scripts/build-dory-ffi-xcframework.sh --if-needed 2>&1 | tee "$DORY_P02_DIRECTORY/evidence/ffi-build.log"
      - name: Build the bounded PVH runner
        timeout-minutes: 30
        run: |
          set -euo pipefail
          swift build --package-path dory-core-swift --scratch-path "$DORY_P02_DIRECTORY/build" \
            --configuration release --jobs 3 --product dory-pc-linux-boot-runner \
            2>&1 | tee "$DORY_P02_DIRECTORY/evidence/runner-build.log"
          runner_directory="$(swift build --package-path dory-core-swift \
            --scratch-path "$DORY_P02_DIRECTORY/build" --configuration release --show-bin-path)"
          test -x "$runner_directory/dory-pc-linux-boot-runner"
          echo "DORY_P02_RUNNER=$runner_directory/dory-pc-linux-boot-runner" >> "$GITHUB_ENV"
          shasum -a 256 "$runner_directory/dory-pc-linux-boot-runner" \
            > "$DORY_P02_DIRECTORY/evidence/runner-sha256.txt"
      - name: Fetch and verify the pinned minimal diagnostic fixture
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 scripts/prepare-virtualization-fixtures.py \
            --id alpine-virt-3.24.1-x86_64 --cache-directory "$DORY_P02_DIRECTORY/fixtures" \
            --extract --diagnostic-initramfs \
            > "$DORY_P02_DIRECTORY/evidence/fixture-preparation.json" \
            2> "$DORY_P02_DIRECTORY/evidence/fixture-preparation.stderr"
          python3 scripts/prepare-virtualization-fixtures.py \
            --id alpine-virt-3.24.1-x86_64 --cache-directory "$DORY_P02_DIRECTORY/fixtures" \
            --verify-only --extract --diagnostic-initramfs \
            > "$DORY_P02_DIRECTORY/evidence/fixture-verification.json" \
            2> "$DORY_P02_DIRECTORY/evidence/fixture-verification.stderr"
          cp "$DORY_P02_DIRECTORY/fixtures/x86_64-p02-minimal-userspace-v2.cpio.manifest.json" \
            "$DORY_P02_DIRECTORY/evidence/initramfs-manifest.json"
      - name: Require all userspace workloads and ACPI poweroff
        timeout-minutes: 17
        run: |
          set -euo pipefail
          run_id="$(uuidgen | tr '[:upper:]' '[:lower:]')"
          printf '%s\n' "$run_id" > "$DORY_P02_DIRECTORY/evidence/run-id.txt"
          set +e
          "$DORY_P02_RUNNER" \
            --kernel "$DORY_P02_DIRECTORY/fixtures/x86_64-vmlinux" \
            --kernel-sha256 e48a2de81362198d41bcac5519c6ae2d8f19e056aec4763fa590d000abf348d8 \
            --initrd "$DORY_P02_DIRECTORY/fixtures/x86_64-p02-minimal-userspace-v2.cpio" \
            --initrd-sha256 22bdcf6331ac87da9fb427037086c9b9b77a4d1ac277e6f2891e2c83adac2249 \
            --symbols "$DORY_P02_DIRECTORY/fixtures/x86_64-System.map-6.18.35" \
            --symbols-sha256 a1909638842396ba3c5acfb88c47678be3c808c7278d04c71241e4ab6935288a \
            --command-line 'console=ttyS0 rdinit=/init panic=-1' \
            --tier "$DORY_P02_TIER" --memory-mib 512 \
            --max-instructions 1000000000 --wall-seconds 900 --run-id "$run_id" \
            --workload bootstrap.filesystems --workload syscall.identity \
            --workload process.creation_exec_wait --workload memory.allocation_copy \
            --workload signal.handler_return --workload timer.sleep_elapsed \
            --workload filesystem.write_read_sync \
            --diagnostics "$DORY_P02_DIRECTORY/evidence/boot-diagnostic.json" \
            > "$DORY_P02_DIRECTORY/evidence/boot-summary.json" \
            2> "$DORY_P02_DIRECTORY/evidence/boot.stderr"
          runner_status=$?
          set -e
          printf '%s\n' "$runner_status" > "$DORY_P02_DIRECTORY/evidence/runner-exit-code.txt"
          cat "$DORY_P02_DIRECTORY/evidence/boot-summary.json"
          cat "$DORY_P02_DIRECTORY/evidence/boot.stderr" >&2
          test "$runner_status" -eq 0
          python3 -I - <<'PY'
          import json, os, pathlib
          evidence = pathlib.Path(os.environ['DORY_P02_DIRECTORY']) / 'evidence'
          summary = json.loads((evidence / 'boot-summary.json').read_text())
          diagnostic = json.loads((evidence / 'boot-diagnostic.json').read_text())
          recipe = json.loads((evidence / 'fixture-recipe.json').read_text())
          run_id = (evidence / 'run-id.txt').read_text().strip()
          workloads = sorted(name for name in recipe['expectedResults'] if name != 'shutdown.request')
          assert summary['kind'] == 'dev.dory.pvh-boot-result'
          assert summary['runID'] == run_id and summary['passed'] is True
          assert summary['exitCode'] == 0 and summary['guestReceiptSeen'] is True
          assert summary['reason'] == 'userspace-workloads-powered-off'
          assert summary['kernelSHA256'] == recipe['kernelSHA256']
          assert summary['initrdSHA256'] == recipe['outputSHA256']
          assert diagnostic['schemaVersion'] == 1 and diagnostic['stage'] == 'finished'
          assert diagnostic['kind'] == 'dev.dory.pvh-boot-diagnostic'
          assert diagnostic['configuration']['runID'] == run_id
          assert diagnostic['outcome'] == {'passed': True, 'reason': 'userspace-workloads-powered-off', 'exitCode': 0}
          assert diagnostic['guestReceipt'] == {'schemaVersion': 1, 'doryPVHBoot': 'userspace-ready',
              'runID': run_id, 'workloadsPassed': True, 'workloads': diagnostic['guestReceipt']['workloads']}
          assert sorted(diagnostic['guestReceipt']['workloads']) == workloads and len(workloads) == 7
          assert diagnostic['lastExits'][-1]['reason'] == 'powered-off'
          print('Accepted: exact run UUID, seven userspace workloads, and host-observed ACPI poweroff')
          PY
      - name: Preserve P02 boot evidence on every outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p02-userspace-${{ matrix.tier }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dory-p02-userspace/evidence
          if-no-files-found: error
          retention-days: 14

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Release publication contract
        run: scripts/publish-release.sh --check
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy
      - name: Install Protocol Buffers compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: scripts/test.sh rust

  macos:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Select Xcode
        run: |
          newest="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          echo "DEVELOPER_DIR=$newest/Contents/Developer" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install Protocol Buffers compiler
        run: brew install protobuf
      - name: Build shared Rust guest-control client
        run: scripts/build-dory-ffi-xcframework.sh --if-needed
      - name: Dory CLI machine create
        run: .github/scripts/test-dory-machine-create.sh
      - name: Signed release metadata contract
        run: |
          python3 .github/scripts/test-no-qemu-production.py
          python3 .github/scripts/test-dory-jit-probe.py
          python3 .github/scripts/test-vz-platform-sdk.py
          python3 .github/scripts/test-release-host-policy.py
          python3 .github/scripts/test-release-metadata.py
          python3 .github/scripts/test-release-output-validator.py
          python3 .github/scripts/test-homebrew-install-gate.py
          python3 .github/scripts/test-container-engine-performance-gate.py
          python3 .github/scripts/test-linux-vm-performance-evidence.py
          python3 -B scripts/test-linux-vm-performance-bundle.py -v
          python3 .github/scripts/test-renderer-production-tuple.py
          python3 -B .github/scripts/test-renderer-release-identity.py -v
          scripts/test-build-renderer-components.sh
          python3 .github/scripts/test-source-preserving-lan-gate.py
          python3 .github/scripts/test-sparkle-install-relaunch-gate.py
          python3 .github/scripts/test-vz-native-ipv6-gate.py
          bash scripts/test-make-dmg.sh
          bash scripts/test-app-update-payload.sh
          bash scripts/test-verify-macos-deployment-targets.sh
          python3 .github/scripts/test-release-orchestrator.py
          bash scripts/test-dmg-distribution-signing.sh
          python3 .github/scripts/test-ci-umbrella.py
          python3 .github/scripts/test-interrupted-upgrade-rollback-gate.py
          python3 .github/scripts/test-generate-appcast.py
          python3 .github/scripts/test-release-sbom.py
          python3 .github/scripts/test-direct-dmg-install-gate.py
          python3 .github/scripts/test-desktop-linux-live-gate.py
          python3 .github/scripts/test-graphics-pack-installer.py
          python3 .github/scripts/test-graphics-backend-resolver.py
          python3 .github/scripts/test-machine-resource-reconfiguration-gate.py
          python3 .github/scripts/test-sandbox-security-gate.py
          python3 .github/scripts/test-ssh-agent-forwarding-gate.py
          python3 .github/scripts/test-bind-advisory-lock-gate.py
          python3 .github/scripts/test-nonnative-build-smoke.py
          python3 .github/scripts/test-external-volume-bind-gate.py
          python3 .github/scripts/test-host-network-integrity-gate.py
          python3 .github/scripts/test-readiness-gate.py
          python3 .github/scripts/test-release-candidate-live-smoke.py
          python3 .github/scripts/test-live-migration-gate.py
          python3 .github/scripts/test-devcontainers-compatibility-gate.py
          python3 .github/scripts/test-act-compatibility-gate.py
          python3 .github/scripts/test-testcontainers-compatibility-gate.py
          python3 .github/scripts/test-localstack-compatibility-gate.py
          python3 .github/scripts/test-tilt-compose-compatibility-gate.py
          python3 .github/scripts/test-supabase-compatibility-gate.py
          python3 .github/scripts/test-kubernetes-tooling-compatibility-gate.py
          python3 .github/scripts/test-default-platform-image-gate.py
          python3 .github/scripts/test-bind-file-coherence-gate.py
          python3 .github/scripts/test-prune-safety-gate.py
          python3 .github/scripts/test-data-drive-volume-identity-gate.py
          python3 .github/scripts/test-data-disk-growth-gate.py
          python3 .github/scripts/test-ecr-registry-retry-gate.py
          python3 .github/scripts/test-private-registry-auth-gate.py
          python3 .github/scripts/test-offline-bundled-boot-gate.py
          python3 .github/scripts/test-competitor-runtime-regression-gate.py
          python3 .github/scripts/test-managed-data-drive-gate.py
          python3 .github/scripts/test-native-ipv6-gate.py
          python3 .github/scripts/test-nonnative-exec-conformance-gate.py
          python3 .github/scripts/test-nonnative-nix-gc-gate.py
          python3 .github/scripts/test-nonnative-arch-pacman-gate.py
          python3 .github/scripts/test-nonnative-mmdebstrap-gate.py
          python3 .github/scripts/test-gvproxy-qemu-switch-gate.py
          python3 .github/scripts/test-long-lived-network-soak.py
          python3 .github/scripts/test-endurance-reliability-soak.py
          python3 .github/scripts/test-release-candidate-qualifier.py
          python3 .github/scripts/test-release-qualification-verifier.py
      - name: Install Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'
      - name: Network helper
        run: scripts/test.sh gvproxy
      - name: Swift packages
        run: scripts/test.sh swift
      - name: App tests
        run: scripts/test.sh app
      - name: UI tests
        run: scripts/test.sh ui
