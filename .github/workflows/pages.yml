name: Deploy Pages

# Builds website/ (React + Vite) and publishes the build output directly to GitHub Pages on
# every push to main; nothing under docs/ is tracked in git. One-time setup: repo
# Settings → Pages → Source → "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
      - '.github/scripts/verify-pages-release-metadata.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Serialize with the release workflow's appcast deployment. A normal site edit must never cancel
  # or overwrite the feed while a signed release is being published.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Configure the job-scoped Sparkle authority cache
        run: echo "DORY_SPARKLE_AUTHORITY_CACHE=$RUNNER_TEMP/dory-sparkle-authority" >> "$GITHUB_ENV"
      - name: Preserve newer live signed release metadata as one transaction
        run: |
          set -euo pipefail
          live="$RUNNER_TEMP/live-release-metadata"
          mkdir -p "$live/components/arm64"
          curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 60 \
            "https://augani.github.io/dory/appcast.xml?preserve=${{ github.run_id }}" \
            -o "$live/appcast.xml"
          for name in catalog.json catalog.json.sha256 catalog.json.sig; do
            curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 60 \
              "https://augani.github.io/dory/components/arm64/$name?preserve=${{ github.run_id }}" \
              -o "$live/components/arm64/$name"
          done
          python3 .github/scripts/verify-pages-release-metadata.py \
            preserve "$live" website/public
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run lint
        working-directory: website
      - run: npm run build
        working-directory: website
      - name: Prove the normal site build retained one exact signed metadata transaction
        run: |
          set -euo pipefail
          cmp website/public/appcast.xml docs-build/appcast.xml
          for name in catalog.json catalog.json.sha256 catalog.json.sig; do
            cmp "website/public/components/arm64/$name" "docs-build/components/arm64/$name"
          done
          python3 .github/scripts/verify-pages-release-metadata.py \
            verify docs-build docs-build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-build
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      - name: Verify all live signed metadata converges to the deployed transaction
        run: |
          set -euo pipefail
          live="$RUNNER_TEMP/deployed-release-metadata"
          mkdir -p "$live/components/arm64"
          for attempt in $(seq 1 18); do
            complete=1
            curl -fsSL --connect-timeout 10 --max-time 30 \
              "https://augani.github.io/dory/appcast.xml?pages=${{ github.run_id }}&attempt=$attempt" \
              -o "$live/appcast.xml" || complete=0
            for name in catalog.json catalog.json.sha256 catalog.json.sig; do
              curl -fsSL --connect-timeout 10 --max-time 30 \
                "https://augani.github.io/dory/components/arm64/$name?pages=${{ github.run_id }}&attempt=$attempt" \
                -o "$live/components/arm64/$name" || complete=0
            done
            if [ "$complete" = 1 ] \
               && cmp docs-build/appcast.xml "$live/appcast.xml" \
               && cmp docs-build/components/arm64/catalog.json "$live/components/arm64/catalog.json" \
               && cmp docs-build/components/arm64/catalog.json.sha256 "$live/components/arm64/catalog.json.sha256" \
               && cmp docs-build/components/arm64/catalog.json.sig "$live/components/arm64/catalog.json.sig"; then
              python3 .github/scripts/verify-pages-release-metadata.py \
                verify "$live" deployed
              echo "All four signed release metadata files converged byte-for-byte."
              exit 0
            fi
            [ "$attempt" -eq 18 ] || sleep 5
          done
          echo "GitHub Pages did not converge to the exact deployed release metadata transaction" >&2
          exit 1
