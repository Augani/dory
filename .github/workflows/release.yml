name: Release Readiness

# Public artifacts are signed, notarized, installed, and published from the maintainer Mac. GitHub
# owns the source gates that can run reproducibly on hosted infrastructure. This keeps the workflow
# honest while the repository has no self-hosted release runner.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version being prepared (for example, 0.4.4)
        required: true
      build:
        description: Monotonically increasing CFBundleVersion
        required: true

permissions:
  contents: read

concurrency:
  group: dory-release-readiness
  cancel-in-progress: false

jobs:
  rust_quality:
    name: Rust quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy
      - name: Install Protocol Buffers compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: scripts/test.sh rust

  website_quality:
    name: Website audit and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --prefix website
      - run: npm audit --prefix website --audit-level=high
      - run: npm run lint --prefix website
      - run: npm run build --prefix website

  macos_quality:
    name: macOS app quality
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Select Xcode
        run: |
          newest="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          test -x "$newest/Contents/Developer/usr/bin/xcodebuild"
          echo "DEVELOPER_DIR=$newest/Contents/Developer" >> "$GITHUB_ENV"
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install build dependencies
        run: brew install protobuf
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'
      - name: Network helper tests
        run: scripts/test.sh gvproxy
      - name: Swift package tests
        run: scripts/test.sh swift
      - name: App tests
        run: scripts/test.sh app
      - name: UI tests
        run: scripts/test.sh ui

  guest_assets_arm64:
    name: Source-built ARM guest assets
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install guest build prerequisites
        run: sudo apt-get update && sudo apt-get install -y binutils e2fsprogs file patchelf zstd
      - name: Expose rust-lld for the static Linux guest agent
        run: |
          rust_lld="$(find "$(rustc --print sysroot)/lib/rustlib" -type f -name rust-lld | head -1)"
          test -x "$rust_lld"
          mkdir -p "$RUNNER_TEMP/rust-lld-bin"
          ln -sf "$rust_lld" "$RUNNER_TEMP/rust-lld-bin/rust-lld"
          echo "$RUNNER_TEMP/rust-lld-bin" >> "$GITHUB_PATH"
      - name: Build and verify headless, GPU, and initfs payloads
        run: |
          DORY_EXPERIMENTAL_GPU=0 guest/kernel/build.sh arm64
          DORY_EXPERIMENTAL_GPU=1 guest/kernel/build.sh arm64
          guest/initfs/build.sh arm64
          DORY_EXPERIMENTAL_GPU=0 guest/kernel/verify-build.sh arm64
          DORY_EXPERIMENTAL_GPU=1 guest/kernel/verify-build.sh arm64
          guest/initfs/verify-build.sh arm64

  ready:
    name: Requested release identity is ready
    needs: [rust_quality, website_quality, macos_quality, guest_assets_arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Validate version and build metadata
        env:
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
        run: |
          printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          printf '%s\n' "$BUILD" | grep -Eq '^[1-9][0-9]*$'
          grep -q "MARKETING_VERSION = $VERSION;" Dory.xcodeproj/project.pbxproj
          grep -q "CURRENT_PROJECT_VERSION = $BUILD;" Dory.xcodeproj/project.pbxproj
          grep -q "^## $VERSION" CHANGELOG.md
          {
            echo "## Dory $VERSION ($BUILD)"
            echo
            echo "All hosted release-readiness gates passed for commit \`$GITHUB_SHA\`."
            echo "The signed/notarized candidate can now be published from the maintainer Mac."
          } >> "$GITHUB_STEP_SUMMARY"
