syntax = "proto3";

// Guest agent RPC, carried as the payload of a dory-proto mux request/response on the control
// channel (vsock port 1024). One request maps to one response by mux id; this envelope only picks
// the method and body.
package dory.agent.v1;

message ClockSyncRequest {
  int64 host_epoch_ns = 1;
}
message ClockSyncResponse {
  bool synced = 1;
}

message InfoRequest {}
message AgentCapability {
  string id = 1;
  uint32 version = 2;
}
message InfoResponse {
  uint32 proto_version = 1;
  string kernel = 2;
  string agent_build = 3;
  uint64 uptime_secs = 4;
  // Independently versioned guest-tool capabilities. New optional entries do not require a
  // transport protocol bump; callers must require the exact capability/version they consume.
  repeated AgentCapability capabilities = 5;
}

message ListenPort {
  string protocol = 1; // "tcp" | "udp"
  uint32 port = 2;
}
message PortEvent {
  string action = 1; // "added" | "removed"
  string protocol = 2;
  uint32 port = 3;
}
message PortsWatchRequest {}
message PortsWatchResponse {
  repeated ListenPort ports = 1;
  repeated PortEvent added = 2;
  repeated PortEvent removed = 3;
}

message RpcError {
  int32 code = 1;
  string message = 2;
}

// Guest memory + pressure telemetry, polled by doryd to compute balloon set-points and idle
// decisions (it alone sees host pressure plus every VM's telemetry). Zeros on a non-Linux host.
message TelemetryRequest {}
message TelemetryResponse {
  uint64 mem_total_kb = 1;
  uint64 mem_available_kb = 2;
  double psi_some_avg10 = 3; // memory-pressure "some" 10s average, percent (0..100)
  double psi_full_avg10 = 4; // memory-pressure "full" 10s average, percent (0..100)
}

// Coordinate application-consistent snapshots. The agent advertises `snapshot-quiesce@1` only
// when the guest contains a usable filesystem-freeze implementation. Freeze and thaw are one
// negotiated capability because callers must always be able to undo a failed snapshot attempt.
message SnapshotQuiesceRequest {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    FREEZE = 1;
    THAW = 2;
  }
  Action action = 1;
  // A host-generated 128-bit lowercase-hex operation receipt. FREEZE and THAW must carry the
  // same value so the host can recover even when a successful freeze reply is lost in transit.
  string receipt_id = 2;
}
message SnapshotQuiesceResponse {
  bool completed = 1;
  string detail = 2;
  // A single-use 128-bit lowercase-hex receipt. Present only after a successful FREEZE.
  string receipt_id = 3;
}

// Acknowledge one host lifecycle operation at the guest boundary. This does not itself pause or
// terminate the VM: it proves that the exact durable operation identity reached the negotiated
// guest agent immediately before/after the corresponding helper transition.
message LifecycleReceiptRequest {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    PREPARE_PAUSE = 1;
    RESUMED = 2;
    PREPARE_STOP = 3;
  }
  Action action = 1;
  // Canonical lowercase RFC 4122 UUID. The all-zero UUID is never a valid operation authority.
  string operation_id = 2;
}
message LifecycleReceiptResponse {
  bool acknowledged = 1;
  LifecycleReceiptRequest.Action action = 2;
  string operation_id = 3;
}

// Attach one host-exported USB/IP device to the guest's vhci controller. The host has already
// claimed the device and exposed it on the fixed USB/IP vsock channel; the guest agent performs
// the USB/IP import handshake and passes that exact connected socket to vhci_hcd.
message UsbVhciAttachRequest {
  string bus_id = 1;
  uint32 port = 2;
  uint32 vsock_port = 3;
  uint32 device_id = 4;
  uint32 speed = 5;
}
message UsbVhciAttachResponse {
  bool attached = 1;
  string bus_id = 2;
  uint32 port = 3;
  uint32 device_id = 4;
}

message UsbVhciDetachRequest {
  string bus_id = 1;
  uint32 port = 2;
}
message UsbVhciDetachResponse {
  bool detached = 1;
  string bus_id = 2;
  uint32 port = 3;
}

// Mount one host-published virtio-fs device inside a qualified Linux guest. This is deliberately a
// Dory Tools capability instead of an Exec recipe: the agent validates the exact mount authority,
// invokes mount(2) directly, and returns only after /proc/self/mountinfo proves the kernel-observed
// source, target, access mode, and mount identity. Callers must negotiate `virtiofs-mount@1`.
message VirtiofsMountRequest {
  string tag = 1;
  string mount_path = 2;
  bool read_only = 3;
}
message VirtiofsMountResponse {
  bool mounted = 1;
  bool already_mounted = 2;
  string tag = 3;
  string mount_path = 4;
  bool read_only = 5;
  uint64 mount_id = 6;
}

// Run a bounded non-interactive command in the guest. This is the primitive doryd uses for
// VM-machine provisioning and smoke checks; streaming terminals/debug shells can layer on a
// separate channel later.
message ExecEnv {
  string key = 1;
  string value = 2;
}
message ExecRequest {
  repeated string argv = 1;
  string cwd = 2;
  repeated ExecEnv env = 3;
  uint64 timeout_ms = 4;
  uint64 output_limit_bytes = 5;
  // Optional bounded stdin payload. This is binary-safe so desktop integration can transfer
  // clipboard images without placing their contents in argv or the environment.
  bytes stdin = 6;
}
message ExecResponse {
  int32 exit_code = 1;
  bytes stdout = 2;
  bytes stderr = 3;
  bool timed_out = 4;
  bool stdout_truncated = 5;
  bool stderr_truncated = 6;
}

// --- Host-authoritative file sync (remote machines) ---
// The host is the source of truth; these push a host tree into a remote `root` directory, making it
// an exact replica. `root` is an absolute path on the remote; `path` is relative to it (forward
// slash). `hash` is the sha256 of the file's full content — used both to skip unchanged files and to
// scope resumable staging.

message SyncFileEntry {
  string path = 1;
  uint64 size = 2;
  int64 mtime_ns = 3;
  uint32 mode = 4;
  bytes hash = 5;
}

// Ask the remote to walk `root` and return its current manifest, so the host can diff.
message SyncManifestRequest { string root = 1; }
message SyncManifestResponse { repeated SyncFileEntry entries = 1; }

// How many bytes are already staged for (path, hash) from a prior interrupted push — the resume
// offset. Zero means start fresh.
message SyncFileStatusRequest {
  string root = 1;
  string path = 2;
  bytes hash = 3;
}
message SyncFileStatusResponse { uint64 have_bytes = 1; }

// Append one chunk to the staged file for (path, hash) at `offset`. When `last` is set the staged
// file is fsynced, its mode/mtime applied, and atomically renamed into place.
message SyncPutChunkRequest {
  string root = 1;
  string path = 2;
  bytes hash = 3;
  uint64 offset = 4;
  bytes data = 5;
  bool last = 6;
  uint32 mode = 7;
  int64 mtime_ns = 8;
}
message SyncPutChunkResponse {
  uint64 next_offset = 1; // bytes now durably staged (or committed size when last)
  bool committed = 2;
}

// Remove these relpaths from `root` (files the host no longer has). Empty dirs left behind are
// pruned by the remote.
message SyncDeleteRequest {
  string root = 1;
  repeated string paths = 2;
}
message SyncDeleteResponse { uint32 deleted = 1; }

// Reconcile the complete file/directory namespace before and after streamed file puts. The first
// pass (`finalize=false`) removes conflicts/extras and creates missing directories. The final pass
// additionally requires every desired file to exist and applies directory modes, closing races and
// preserving empty directories without sentinel files.
message SyncDirectoryEntry {
  string path = 1;
  uint32 mode = 2;
}
message SyncTreeRequest {
  string root = 1;
  repeated string files = 2;
  repeated SyncDirectoryEntry directories = 3;
  bool finalize = 4;
}
message SyncTreeResponse {
  uint32 paths_deleted = 1;
  uint32 directories_created = 2;
}

// Read-only counterpart used for guest-to-host transfers. The manifest is a point-in-time content
// authority; the host must hash the fully assembled destination and reject it if guest bytes change
// while they are being read. Empty directories are explicit so a pull never invents sentinel files.
message SyncReadTreeRequest {
  string root = 1;
  uint64 max_files = 2;
  uint64 max_directories = 3;
  uint64 max_bytes = 4;
}
message SyncReadTreeResponse {
  repeated SyncFileEntry files = 1;
  repeated SyncDirectoryEntry directories = 2;
}

// Read one bounded range from a regular file observed in SyncReadTreeResponse. `expected_size`
// makes growth/truncation fail before bytes are accepted; the manifest SHA-256 remains the final
// authority for same-size concurrent mutation. Responses are capped by the agent at CHUNK_BYTES.
message SyncGetChunkRequest {
  string root = 1;
  string path = 2;
  uint64 offset = 3;
  uint32 max_bytes = 4;
  uint64 expected_size = 5;
}
message SyncGetChunkResponse {
  bytes data = 1;
  uint64 next_offset = 2;
  bool eof = 3;
}

message AgentRequest {
  oneof method {
    ClockSyncRequest clock_sync = 1;
    InfoRequest info = 2;
    PortsWatchRequest ports_watch = 3;
    SyncManifestRequest sync_manifest = 4;
    SyncFileStatusRequest sync_file_status = 5;
    SyncPutChunkRequest sync_put_chunk = 6;
    SyncDeleteRequest sync_delete = 7;
    TelemetryRequest telemetry = 8;
    ExecRequest exec = 9;
    SnapshotQuiesceRequest snapshot_quiesce = 10;
    SyncTreeRequest sync_tree = 11;
    SyncReadTreeRequest sync_read_tree = 12;
    SyncGetChunkRequest sync_get_chunk = 13;
    LifecycleReceiptRequest lifecycle_receipt = 14;
    UsbVhciAttachRequest usb_vhci_attach = 15;
    UsbVhciDetachRequest usb_vhci_detach = 16;
    VirtiofsMountRequest virtiofs_mount = 17;
  }
}

message AgentResponse {
  oneof result {
    RpcError error = 1;
    ClockSyncResponse clock_sync = 2;
    InfoResponse info = 3;
    PortsWatchResponse ports_watch = 4;
    SyncManifestResponse sync_manifest = 5;
    SyncFileStatusResponse sync_file_status = 6;
    SyncPutChunkResponse sync_put_chunk = 7;
    SyncDeleteResponse sync_delete = 8;
    TelemetryResponse telemetry = 9;
    ExecResponse exec = 10;
    SnapshotQuiesceResponse snapshot_quiesce = 11;
    SyncTreeResponse sync_tree = 12;
    SyncReadTreeResponse sync_read_tree = 13;
    SyncGetChunkResponse sync_get_chunk = 14;
    LifecycleReceiptResponse lifecycle_receipt = 15;
    UsbVhciAttachResponse usb_vhci_attach = 16;
    UsbVhciDetachResponse usb_vhci_detach = 17;
    VirtiofsMountResponse virtiofs_mount = 18;
  }
}
